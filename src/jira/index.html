<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management Board</title>
  <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    [un-cloak] { display: none; }
    .kanban-column { min-width: 320px; max-width: 320px; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
  </style>
</head>
<body class="bg-[#F4F5F7] font-sans text-[#172B4D] h-screen overflow-hidden flex" un-cloak>

  <Sidebar rx:src="./src/jira/Sidebar.rx.html"></Sidebar>

  <Main rx:src="./src/jira/Main.rx.html"></Main>

  <PropertyPane rx:src="./src/jira/PropertyPane.rx.html"></PropertyPane>

  <script>
    // Sample JSON Data Structure
    const taskData = {
      columns: [
        { id: 'todo', title: 'To Do', tasks: [
          { id: 'PROJ-1', title: 'Implement MicroRX signals', priority: 'High', user: 'JD' },
          { id: 'PROJ-2', title: 'Draft Growth Playbook', priority: 'Medium', user: 'AM' }
        ]},
        { id: 'in-progress', title: 'In Progress', tasks: [
          { id: 'PROJ-3', title: 'Ollama RAG Configuration', priority: 'High', user: 'SK' }
        ]},
        { id: 'done', title: 'Done', tasks: [] }
      ]
    };

    function renderBoard() {
      const container = document.getElementById('board-container');
      container.innerHTML = taskData.columns.map(col => `
        <div class="kanban-column flex flex-col h-full bg-[#EBECF0] rounded-lg p-3">
          <h3 class="text-sm font-bold text-gray-600 mb-4 px-1 uppercase tracking-wider">${col.title} ${col.tasks.length}</h3>
          <div class="space-y-3 flex-1 overflow-y-auto">
            ${col.tasks.map(task => `
              <div class="bg-white p-4 rounded shadow-sm border border-transparent hover:border-[#4C9AFF] transition cursor-pointer group relative">
                <button onclick="openPane('${task.id}', '${task.title}')" class="absolute top-2 right-2 p-1 opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-blue-600">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                </button>
                <p class="text-sm mb-4 leading-relaxed">${task.title}</p>
                <div class="flex justify-between items-center">
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] font-bold text-gray-400 tracking-tighter">${task.id}</span>
                    <i data-lucide="chevron-up" class="w-4 h-4 text-red-500"></i>
                  </div>
                  <div class="w-6 h-6 rounded-full bg-purple-600 text-[10px] text-white flex items-center justify-center font-bold">
                    ${task.user}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function openPane(id, title) {
      document.getElementById('pane-task-id').innerText = id;
      document.getElementById('pane-task-title').innerText = title;
      document.getElementById('property-pane').classList.remove('translate-x-full');
    }

    function closePane() {
      document.getElementById('property-pane').classList.add('translate-x-full');
    }

    renderBoard();
  </script>
</body>
</html>
