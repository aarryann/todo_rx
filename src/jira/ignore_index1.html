<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management Board</title>
  <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    [un-cloak] { display: none; }
    .kanban-column { min-width: 320px; max-width: 320px; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
  </style>
</head>
<body class="bg-[#F4F5F7] font-sans text-[#172B4D] h-screen overflow-hidden flex" un-cloak>

  <aside class="w-16 bg-[#0747A6] flex flex-col items-center py-4 gap-6 text-white shrink-0">
    <div class="p-2 bg-white/20 rounded-lg"><i data-lucide="layout-dashboard"></i></div>
    <div class="p-2 hover:bg-white/10 rounded-lg cursor-pointer"><i data-lucide="check-square"></i></div>
    <div class="mt-auto p-2 hover:bg-white/10 rounded-lg cursor-pointer"><i data-lucide="settings"></i></div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0">
    <header class="p-6 bg-white border-b border-gray-200 flex justify-between items-center">
      <h1 class="text-xl font-bold">Project Velocity</h1>
      <button class="bg-[#0052CC] text-white px-4 py-2 rounded font-medium hover:bg-[#0747A6] transition">Create Issue</button>
    </header>

    <section class="flex-1 overflow-x-auto p-6 flex gap-6 custom-scrollbar" id="board-container">
      </section>
  </main>

  <div id="property-pane" class="fixed inset-y-0 right-0 w-96 bg-white shadow-2xl border-l border-gray-200 transform translate-x-full transition-transform duration-300 ease-in-out z-50">
    <div class="h-full flex flex-col p-6">
      <div class="flex justify-between items-center mb-6">
        <span class="text-xs font-bold text-gray-500 uppercase tracking-widest" id="pane-task-id">TASK-101</span>
        <button onclick="closePane()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x"></i></button>
      </div>
      
      <h2 class="text-xl font-semibold mb-4 outline-none focus:ring-2 ring-blue-500 rounded p-1" contenteditable="true" id="pane-task-title">
        Task Title
      </h2>

      <div class="space-y-6 overflow-y-auto pr-2 custom-scrollbar">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Description</label>
          <textarea class="w-full border border-gray-200 rounded p-3 text-sm min-h-32 focus:border-blue-500 outline-none" placeholder="Add a description..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Status</label>
            <select class="w-full bg-gray-100 border-none rounded p-2 text-sm font-medium">
              <option>To Do</option>
              <option>In Progress</option>
              <option>Done</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Priority</label>
            <div class="flex items-center gap-2 bg-gray-100 p-2 rounded text-sm cursor-pointer">
              <i data-lucide="chevron-up" class="text-red-500 w-4"></i> High
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Sample JSON Data Structure
    const taskData = {
      columns: [
        { id: 'todo', title: 'To Do', tasks: [
          { id: 'PROJ-1', title: 'Implement MicroRX signals', priority: 'High', user: 'JD' },
          { id: 'PROJ-2', title: 'Draft Growth Playbook', priority: 'Medium', user: 'AM' }
        ]},
        { id: 'in-progress', title: 'In Progress', tasks: [
          { id: 'PROJ-3', title: 'Ollama RAG Configuration', priority: 'High', user: 'SK' }
        ]},
        { id: 'done', title: 'Done', tasks: [] }
      ]
    };

    function renderBoard() {
      const container = document.getElementById('board-container');
      container.innerHTML = taskData.columns.map(col => `
        <div class="kanban-column flex flex-col h-full bg-[#EBECF0] rounded-lg p-3">
          <h3 class="text-sm font-bold text-gray-600 mb-4 px-1 uppercase tracking-wider">${col.title} ${col.tasks.length}</h3>
          <div class="space-y-3 flex-1 overflow-y-auto">
            ${col.tasks.map(task => `
              <div class="bg-white p-4 rounded shadow-sm border border-transparent hover:border-[#4C9AFF] transition cursor-pointer group relative">
                <button onclick="openPane('${task.id}', '${task.title}')" class="absolute top-2 right-2 p-1 opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-blue-600">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                </button>
                <p class="text-sm mb-4 leading-relaxed">${task.title}</p>
                <div class="flex justify-between items-center">
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] font-bold text-gray-400 tracking-tighter">${task.id}</span>
                    <i data-lucide="chevron-up" class="w-4 h-4 text-red-500"></i>
                  </div>
                  <div class="w-6 h-6 rounded-full bg-purple-600 text-[10px] text-white flex items-center justify-center font-bold">
                    ${task.user}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function openPane(id, title) {
      document.getElementById('pane-task-id').innerText = id;
      document.getElementById('pane-task-title').innerText = title;
      document.getElementById('property-pane').classList.remove('translate-x-full');
    }

    function closePane() {
      document.getElementById('property-pane').classList.add('translate-x-full');
    }

    renderBoard();
  </script>
</body>
</html>
