<div rx-for="column in columns key by id">
  <div class="kanban-column flex flex-col h-full bg-[#EBECF0] rounded-lg p-3">
    <h3 class="text-sm font-bold text-gray-600 mb-4 px-1 uppercase tracking-wider">{{column.title}}</h3>
    <div class="space-y-3 flex-1 overflow-y-auto" rx-for="task in column.tasks key by id">
      <Task rx:src="./src/jira/Task.rx.html"></Task>
    </div>
  </div>
</div>
