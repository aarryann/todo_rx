<div class="card bg-white rounded-md p-3 m-3 shadow hover:shadow-lg transition-shadow duration-200 ease-in-out cursor-pointer transform hover:scale-[1.01]">
  <h3 class="font-semibold text-sm m-1">{{card.title}}</h3>

  <span rx-if="card.completed" class="completed text-green-600 font-bold text-xs mb-2 block">
    ✔ Done
  </span>

  <ul class="tags flex flex-wrap gap-1 mt-2 pl-1" rx-for="tag in card.tags key by description">
    <li class="list-none">
      <Tag class="block" rx:src="./src/board/Tag.rx.html"></Tag>
    </li>
  </ul>
</div>
