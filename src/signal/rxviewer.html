<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RxViewer - Signal Inspector</title>
  <link rel="stylesheet" href="./rxviewer.css">
</head>
<body>

<div id="status-bar" class="toolbar">
    <div id="status-dot" class="dot"></div>
    <span id="status-text">Disconnected</span>
    <div class="toolbar-divider"></div>

    <button id="powerModeBtn" class="toolbar-button" title="Toggle Power Mode (Capture all signal transitions)">
        <span class="power-icon">⚡</span> Power Mode
    </button>

    <div class="toolbar-divider"></div>
    <button id="reloadBtn" class="toolbar-button">
        <span class="refresh-icon">↻</span> Reload
    </button>
</div>
<div id="editor" class="tree-container"></div>

<script type="module" src="./rxviewer.js"></script>
</body>
</html>
