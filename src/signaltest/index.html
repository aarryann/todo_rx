<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Screen Iframe Layout</title>
  <style>
    /* Remove default margins and ensure full height */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* The container holding both sides */
    .split-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Left Side: Navigation/Controls */
    .left-side {
      width: 50%; /* Fixed width */
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      box-sizing: border-box;
      border-right: 2px solid #1a252f;
    }

    /* Right Side: The Iframe Container */
    .right-side {
      flex-grow: 1; /* Takes up remaining space */
      background-color: #ecf0f1;
      position: relative;
    }

    /* The Iframe itself */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="split-container">
    <div class="left-side">
      <h1 id="title"></h1>
      <p id="tag"></p>

      <input type="text" id="newTitle" placeholder="New Title" />
      <input type="text" id="newTag" placeholder="New Tag" /><br/><br/>

      <button id="setTitle">setTitle</button>
      <button id="changeTag">Change Tag</button>
      <button id="addCard">Add Card</button>

      <script type="module" src="./index.js"></script>
    </div>

    <div class="right-side">
      <iframe 
        src="rxviewer.html" id="viewer-frame"
        title="Inspected Window">
      </iframe>
    </div>
  </div>

</body>
</html>
